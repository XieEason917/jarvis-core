<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. // TACTICAL HOLOGRAPHIC CORE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #020612 !important;
      overflow: hidden;
      font-family: 'Courier New', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #00f0ff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .bg-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 2;
      pointer-events: none;
    }
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 14px;
    }
    .brand-title {
      font-size: 22px;
      letter-spacing: 6px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 16px #00f0ff;
    }
    .brand-sub {
      font-size: 10px;
      color: rgba(0, 240, 255, 0.6);
      letter-spacing: 3px;
      margin-top: 4px;
    }
    .sys-telemetry {
      text-align: right;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #00ffaa;
      font-weight: bold;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ffaa;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffaa;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .asset-deck {
      display: flex;
      gap: 14px;
      margin-top: 16px;
    }
    .card {
      background: rgba(3, 18, 38, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-left: 3px solid #00f0ff;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
      min-width: 155px;
    }
    .card-ticker {
      font-size: 10px;
      color: rgba(0, 240, 255, 0.6);
      letter-spacing: 1px;
    }
    .card-val {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 1px;
      margin: 3px 0;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    .card-status {
      font-size: 10px;
      color: #00ffaa;
    }
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid rgba(0, 240, 255, 0.15);
      padding-top: 14px;
    }
    .wave-box {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
    }
    .wave-bar {
      width: 3px;
      background: #00f0ff;
      box-shadow: 0 0 6px #00f0ff;
      border-radius: 1px;
      animation: wave-anim 1.2s infinite ease-in-out;
    }
    @keyframes wave-anim {
      0%, 100% { height: 4px; }
      50% { height: 22px; }
    }
    .interactive-trigger {
      pointer-events: auto;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 2px;
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 14px;
      background: rgba(0, 240, 255, 0.08);
      transition: all 0.2s;
    }
    .interactive-trigger:hover {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px #00f0ff;
      color: #fff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="bg-grid"></div>
  <div id="canvas-container"></div>

  <div class="hud-layer">
    <div>
      <div class="hud-header">
        <div>
          <div class="brand-title">J.A.R.V.I.S. // TACTICAL CORE</div>
          <div class="brand-sub">QUANTUM RECONNAISSANCE SUITE // MK-VII</div>
        </div>
        <div class="sys-telemetry">
          <div class="status-badge"><span class="status-dot"></span>SENTINEL ARMED</div>
          <div id="clock-display" style="color: rgba(0,240,255,0.7); margin-top: 4px;">00:00:00 CST</div>
        </div>
      </div>

      <div class="asset-deck">
        <div class="card">
          <div class="card-ticker">加權正2 (00685L)</div>
          <div class="card-val">BULL DEFENSE</div>
          <div class="card-status">20MA / 60MA 鎖定</div>
        </div>
        <div class="card">
          <div class="card-ticker">宜鼎 (5289)</div>
          <div class="card-val">ACTIVE PATROL</div>
          <div class="card-status">週期: 5-MIN 哨兵</div>
        </div>
        <div class="card">
          <div class="card-ticker">群聯 (8299)</div>
          <div class="card-val">NAND CYCLE</div>
          <div class="card-status">波浪扣抵 追蹤中</div>
        </div>
      </div>
    </div>

    <div class="hud-footer">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="wave-box" id="wave-container"></div>
        <span style="font-size: 10px; letter-spacing: 2px; color: rgba(0,240,255,0.5);">TACTICAL FLUX: 98.4%</span>
      </div>
      <div class="interactive-trigger" onclick="overchargeCore()">[ 觸發反應爐全功率超頻 ]</div>
    </div>
  </div>

  <script>
    const waveBox = document.getElementById('wave-container');
    for (let i = 0; i < 16; i++) {
      const bar = document.createElement('div');
      bar.className = 'wave-bar';
      bar.style.animationDelay = `${(i * 0.07)}s`;
      waveBox.appendChild(bar);
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020612); // 底層鎖死深邃黑藍

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
    camera.position.z = 210;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    // 向量線框核心 (二十面體多邊形)
    const icoGeo = new THREE.IcosahedronGeometry(28, 1);
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      wireframe: true,
      transparent: true,
      opacity: 0.85
    });
    const icoMesh = new THREE.Mesh(icoGeo, wireMat);
    coreGroup.add(icoMesh);

    // 反應內核
    const innerGeo = new THREE.BufferGeometry();
    const innerCount = 1800;
    const innerPos = new Float32Array(innerCount * 3);
    for (let i = 0; i < innerCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = Math.cbrt(Math.random()) * 13;
      innerPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      innerPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      innerPos[i * 3 + 2] = r * Math.cos(phi);
    }
    innerGeo.setAttribute('position', new THREE.BufferAttribute(innerPos, 3));
    const innerMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.2,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });
    const innerCore = new THREE.Points(innerGeo, innerMat);
    coreGroup.add(innerCore);

    // 軍規同心刻度環
    function createTacticalRing(radius, segments, dashCount, color, opacity) {
      const group = new THREE.Group();
      const angleStep = (Math.PI * 2) / segments;
      const points = [];

      for (let i = 0; i < segments; i++) {
        const theta1 = i * angleStep;
        const theta2 = (i + 0.6) * angleStep;
        if (i % dashCount === 0) continue;

        points.push(
          new THREE.Vector3(radius * Math.cos(theta1), radius * Math.sin(theta1), 0),
          new THREE.Vector3(radius * Math.cos(theta2), radius * Math.sin(theta2), 0)
        );
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({
        color: color,
        transparent: true,
        opacity: opacity
      });
      const lines = new THREE.LineSegments(geo, mat);
      group.add(lines);
      return group;
    }

    const ring1 = createTacticalRing(45, 64, 4, 0x00f0ff, 0.7);
    const ring2 = createTacticalRing(62, 80, 5, 0x00a8ff, 0.5);
    const ring3 = createTacticalRing(80, 96, 6, 0x0055ff, 0.35);

    ring1.rotation.x = Math.PI / 4;
    ring2.rotation.y = Math.PI / 3;
    ring3.rotation.x = -Math.PI / 3;

    scene.add(ring1);
    scene.add(ring2);
    scene.add(ring3);

    // 雷達掃描射束
    const sweepGeo = new THREE.BufferGeometry();
    const sweepPoints = [];
    for (let a = 0; a <= 45; a += 1.5) {
      const rad = (a * Math.PI) / 180;
      sweepPoints.push(
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(82 * Math.cos(rad), 82 * Math.sin(rad), 0)
      );
    }
    sweepGeo.setFromPoints(sweepPoints);
    const sweepMat = new THREE.LineBasicMaterial({
      color: 0x00f0ff,
      transparent: true,
      opacity: 0.15
    });
    const radarSweep = new THREE.LineSegments(sweepGeo, sweepMat);
    scene.add(radarSweep);

    let clock = new THREE.Clock();
    let overcharge = 0;

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const t = clock.getElapsedTime();

      icoMesh.rotation.x = t * 0.45;
      icoMesh.rotation.y = t * 0.3;
      innerCore.rotation.y = -t * 0.6;
      
      const pulse = 1 + Math.sin(t * 2.5) * 0.05 + overcharge;
      coreGroup.scale.set(pulse, pulse, pulse);

      ring1.rotation.z = t * 0.35;
      ring2.rotation.z = -t * 0.25;
      ring3.rotation.z = t * 0.15;
      ring2.rotation.x = Math.sin(t * 0.5) * 0.3 + (Math.PI / 3);

      radarSweep.rotation.z = -t * 1.2;

      if (overcharge > 0) {
        overcharge *= 0.94;
        if (overcharge < 0.005) overcharge = 0;
      }

      renderer.render(scene, camera);
    }
    renderLoop();

    window.overchargeCore = function() {
      overcharge = 0.4;
      wireMat.color.setHex(0xffffff);
      setTimeout(() => { wireMat.color.setHex(0x00f0ff); }, 280);
    };

    window.addEventListener('click', (e) => {
      if (e.target.tagName !== 'DIV') return;
      overchargeCore();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0] + ' CST';
    }, 1000);
  </script>
</body>
</html>
