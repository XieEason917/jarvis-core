<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. // NEURAL CORE TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cyan: #00f5d4;
      --cyan-glow: rgba(0, 245, 212, 0.4);
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, #051026 0%, #01060e 100%);
      overflow: hidden;
      font-family: 'Rajdhani', 'Orbitron', monospace;
      color: #fff;
    }

    /* 背景星空粒子與經緯格線 */
    .bg-grid {
      position: absolute;
      width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 245, 212, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 212, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    /* 中央核心容器：100% 呈現你上傳的宇宙大腦原圖 */
    .core-stage {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .brain-visual {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0, 245, 212, 0.35));
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: gentle-breath 4s ease-in-out infinite;
    }

    /* 說話與聆聽時的通電放大特效 */
    .speaking-pulse {
      transform: scale(1.1);
      filter: drop-shadow(0 0 55px rgba(0, 245, 212, 0.85)) brightness(1.25) !important;
    }
    .listening-pulse {
      transform: scale(1.05);
      filter: drop-shadow(0 0 40px rgba(255, 0, 85, 0.65)) !important;
    }

    @keyframes gentle-breath {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(0, 245, 212, 0.3)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 38px rgba(0, 245, 212, 0.5)); }
    }

    /* 頂部標題列 */
    .top-header {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 50px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 30px;
      border-bottom: 1px solid rgba(0, 245, 212, 0.2);
      background: rgba(1, 6, 14, 0.7);
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .top-title {
      font-family: 'Orbitron'; font-size: 16px; letter-spacing: 3px; font-weight: 900;
      color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow);
    }
    .top-status {
      font-size: 12px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.7);
    }

    /* 下方對話紀錄視窗 */
    .chat-container {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      z-index: 15;
      mask-image: linear-gradient(to top, black 80%, transparent 100%);
    }

    .chat-msg {
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 1px;
      max-width: 85%;
    }
    .msg-user {
      align-self: flex-end;
      background: rgba(0, 245, 212, 0.15);
      border-right: 3px solid var(--cyan);
      color: #fff;
    }
    .msg-jarvis {
      align-self: flex-start;
      background: rgba(1, 15, 30, 0.85);
      border-left: 3px solid var(--cyan);
      color: #e0f7fa;
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.1);
    }

    /* 底部輸入條 */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 54px;
      background: rgba(1, 10, 20, 0.95);
      border-top: 1px solid rgba(0, 245, 212, 0.25);
      display: flex; justify-content: center; align-items: center;
      padding: 0 20px;
      z-index: 20;
    }
    .input-box {
      width: 100%; max-width: 800px;
      display: flex; gap: 12px; align-items: center;
    }
    .input-field {
      flex: 1;
      background: rgba(2, 14, 26, 0.8);
      border: 1px solid rgba(0, 245, 212, 0.3);
      padding: 8px 16px;
      font-size: 14px;
      color: #fff;
      font-family: 'Rajdhani';
      outline: none;
      border-radius: 2px;
    }
    .input-field:focus { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-glow); }
    .voice-btn {
      background: rgba(0, 245, 212, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 2px;
      font-family: 'Orbitron';
      transition: all 0.2s;
    }
    .voice-btn:hover { background: var(--cyan); color: #01060e; }
    .voice-btn.recording { background: #ff0055; border-color: #ff0055; color: #fff; }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="top-header">
    <div class="top-title">J.A.R.V.I.S. // NEURAL CORE</div>
    <div class="top-status" id="sys-status">STATUS: STANDBY</div>
  </div>

  <!-- 中央宇宙大腦實體（精準對接 賈維斯大腦.jpg） -->
  <div class="core-stage">
    <img id="brain-img" class="brain-visual" src="賈維斯大腦.jpg" alt="JARVIS Core">
  </div>

  <!-- 下方對話紀錄視窗 -->
  <div class="chat-container" id="chat-logs">
    <div class="chat-msg msg-jarvis">長官，神經網絡核心已就緒，隨時聽候您的指示。</div>
  </div>

  <!-- 底部指令與語音列 -->
  <div class="bottom-bar">
    <div class="input-box">
      <input type="text" id="cmd-input" class="input-field" placeholder="> 輸入戰術指令或長按 [空白鍵] 對話..." autocomplete="off">
      <button id="voice-btn" class="voice-btn" onclick="toggleVoice()">🎙️ 語音通話</button>
    </div>
  </div>

  <script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxWyoDCeA23D4ZIcUzhWcmm6RBpORpy3Sw7TO39ZR2WZoIA80IJzXq79cvYw0Z-EATspw/exec";
    const brainImg = document.getElementById('brain-img');
    const chatLogs = document.getElementById('chat-logs');
    const cmdInput = document.getElementById('cmd-input');
    const voiceBtn = document.getElementById('voice-btn');
    const statusText = document.getElementById('sys-status');

    function appendMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `chat-msg ${sender === 'user' ? 'msg-user' : 'msg-jarvis'}`;
      msg.innerText = text;
      chatLogs.appendChild(msg);
      chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    function setVisualState(state) {
      brainImg.classList.remove('speaking-pulse', 'listening-pulse');
      if (state === 'LISTENING') {
        brainImg.classList.add('listening-pulse');
        statusText.innerText = 'STATUS: LISTENING';
      } else if (state === 'SPEAKING') {
        brainImg.classList.add('speaking-pulse');
        statusText.innerText = 'STATUS: DISPATCHING';
      } else {
        statusText.innerText = 'STATUS: STANDBY';
      }
    }

    async function askJarvis(query) {
      if (!query.trim()) return;
      appendMessage('user', query);
      cmdInput.value = '';
      statusText.innerText = 'STATUS: PROCESSING...';

      try {
        const res = await fetch(`${GAS_ENDPOINT}?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        const reply = data.reply || "鏈路回傳正常，Sir。";
        appendMessage('jarvis', reply);
        speakVoice(reply);
      } catch (err) {
        appendMessage('jarvis', "回報長官，連線逾時。");
        statusText.innerText = 'STATUS: STANDBY';
      }
    }

    function speakVoice(text) {
      setVisualState('SPEAKING');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 1.0;
        utter.pitch = 0.85;
        utter.onend = () => setVisualState('STANDBY');
        window.speechSynthesis.speak(utter);
      } else {
        setTimeout(() => setVisualState('STANDBY'), 3000);
      }
    }

    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askJarvis(cmdInput.value);
    });

    let recognition = null;
    let isRecording = false;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        stopVoice();
        askJarvis(text);
      };
      recognition.onerror = () => stopVoice();
      recognition.onend = () => stopVoice();
    }

    function startVoice() {
      if (!recognition || isRecording) return;
      isRecording = true;
      setVisualState('LISTENING');
      voiceBtn.classList.add('recording');
      voiceBtn.innerText = "🔴 聆聽中...";
      try { recognition.start(); } catch(e) {}
    }

    function stopVoice() {
      if (!isRecording) return;
      isRecording = false;
      setVisualState('STANDBY');
      voiceBtn.classList.remove('recording');
      voiceBtn.innerText = "🎙️ 語音通話";
      try { recognition.stop(); } catch(e) {}
    }

    function toggleVoice() {
      if (isRecording) stopVoice(); else startVoice();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target !== cmdInput && !isRecording) {
        e.preventDefault(); startVoice();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space' && isRecording) {
        e.preventDefault(); stopVoice();
      }
    });
  </script>
</body>
</html>
